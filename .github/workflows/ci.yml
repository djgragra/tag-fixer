name: CI

# Runs the tests on every pull request and every push to main, so a change is checked before it is merged
# (the release workflow only runs on tags and by hand).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # exiftool is the independent reader of the cross-check tests (they are skipped without it)
      - run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl
      - run: npm ci --ignore-scripts
      - run: npm test
